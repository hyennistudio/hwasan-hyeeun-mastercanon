- 정확한 나이·경지·스승; 차기 용두방주 지위의 권한 범위; 타구봉법 성수·내공; 상호 호칭. 19화 첫 만남과 은정에게 안내한 경위는 확정. 본명 류지광·팔결·차기 용두방주·통합 시트는 등록 완료. (§11.10)
