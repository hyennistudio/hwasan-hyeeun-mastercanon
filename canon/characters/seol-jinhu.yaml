- field: 성격·외모 특징
  value:
    text: 수려한 성인 청년 외모. 검은 긴 반묶음 머리, 청록·금사 예복, 과한 옥 장신구와 반지. 어머니를 닮아 사치스럽고 망나니 기질이 있으나 단순히 머리가 나쁜 인물은 아니다. 타인의 의도를 빨리 읽지만 인내·수련·책임에는 쉽게 싫증을 낸다. 혈통에 따른 계승을 당연한 권리로 여겨 희선의 실력과 신망을 인정하기 어려워한다. 능청스러운 웃음과 비아냥으로 열등감을 숨기며, 공개적으로 무시당하면 즉흥적으로 대응한다. 아버지에게 인정받고 싶으면서 노력 대신 특권을 요구한다. 어머니의 과보호가 판단을 대신해온 것이 결함이다. 그러나 궁도의 희생까지 허용하는 잔혹함은 없으며, 결국 어머니의 증거 파기를 막고 궁을 선택하는 기존 성장선을 유지한다.
    locator: §2.25
  status: draft
  source_ids:
  - src-mastercanon-20261028
- field: 관계·목적·정보 범위
  value:
    text: 설무극과 백소연의 아들. 어머니의 증거 파기를 막고 궁을 택한다.
    locator: §2.25
  status: draft
  source_ids:
  - src-mastercanon-20261028
- field: 무공·무기·그 밖의 설정
  value:
    text: 미확정
    locator: §2.25
  status: draft
  source_ids:
  - src-mastercanon-20261028
- field: 고정지침
  value:
    text: 처음부터 혈교 공범으로 자동 지정하지 않는다.
    locator: §2.25
  status: draft
  source_ids:
  - src-mastercanon-20261028
- field: 보이스톤
  value:
    text: 성인 남성 청년의 매끈한 중음. 윤종의 맑고 성실한 중고음보다 낮고 느슨하며, 장문인들의 묵직한 저음보다 가볍다. 평소에는 조금 늘어진 말의 박자와 짧은 코웃음, 문장 끝의 비스듬한 상승 억양으로 자신감과 빈정거림을 드러낸다. 자음은 들릴 만큼 정확하게 유지하고 과도하게 혀를 굴리거나 만화 악역처럼 웃지 않는다. 희선에게는 웃음을 섞어 도발하고, 아버지 앞에서는 존대하되 눌러둔 불만이 호흡에 묻어난다. 어머니 앞에서는 응석과 짜증이 나타나지만 어린아이 목소리로 바꾸지 않는다. 분노하면 말이 짧고 빨라지고 호흡이 거칠어지며 억양의 여유가 무너진다. 진심으로 궁도를 지키기로 결심할 때는 코웃음과 끄는 말끝을 없애고 같은 중음 안에서 또렷하고 곧게 말한다.
    locator: §2.25
  status: draft
  source_ids:
  - src-mastercanon-20261028
- field: 대사·연기 고정지침
  value:
    text: '대사 습관: 빈정거리는 질문과 권리 주장. 아버지는 아버님, 어머니는 어머니. 희선에게는 공석에서 소궁주, 도발 장면에서는 희선이라는 이름을 사용한다. 연기 시험 대사: [내가 태어난 궁에서, 내가 손님이 됐군.] / [어머니. 그 기록에는 우리 사람들의 이름이 있습니다.]

      시험 대사는 보이스 확인용이며 회차에 자동 삽입하지 않는다.'
    locator: §2.25
  status: draft
  source_ids:
  - src-mastercanon-20261028
- field: 캐릭터 시트 — 기수·모드 순서
  value:
    text: "- 기수 미지정\n  - 자료: exec-2c1dcf57-fe13-4bf9-a8ac-cea9c0d419b7.png — 이번 대화에서 생성한 실사 통합 시트.\n  - 자산 식별: 지속 자산 ID 미확인. 로컬 생성 자료: /workspace/scratch/378cd388864c/generated_images/exec-2c1dcf57-fe13-4bf9-a8ac-cea9c0d419b7.png\n  - 상세 고정: 수려한 얼굴·검은 장발 반묶음, 금색·청옥 머리 장식, 짙은 청록 긴 금사 예복·아이보리 안옷·옥 허리 장식·금속 태슬·장식 반지·금사 장화, 빙궁 문양·표정. 무기 패널 없음.\n  - 정면·후면·사선·얼굴·착장·장신구·신발·표정을 포함한다. 분할 화면과 시트 글자는 영상에 재현하지 않는다."
    locator: §2.25
