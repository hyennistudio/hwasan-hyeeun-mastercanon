- field: 성격·외모 특징
  value:
    text: 외모는 20대 후반. 북해제일미. 검은 긴 머리와 화려한 올림 장식, 청록·금색 예복, 백색 모피와 옥·진주·보석 장신구. 매우 사치스럽고 관능적이며 아름다움과 예법을 권력으로 사용한다. 겉으로는 우아하고 다정하지만 타인의 선택을 자신이 정해주는 통제욕이 강하다. 아들의 계승을 사랑과 자기 지위의 보장으로 동시에 여긴다. 희선을 대할 때 예의를 지키면서 혈통·은혜·궁의 전통을 들어 배제한다. 반대자를 처음부터 고함으로 몰아붙이지 않고 상대의 체면과 죄책감을 이용한다. 아들에 대한 사랑은 진심이지만 사랑을 명분으로 선택권을 빼앗는다. 궁도의 피해와 혈교 개입의 인지 시점은 기존 사건 확정 전까지 임의로 확대하지 않는다.
    locator: §2.24
  status: draft
  source_ids:
  - src-mastercanon-20261028
- field: 관계·목적·정보 범위
  value:
    text: 설무극의 첫째 부인·설진후의 어머니. 희선의 외부인 계승에 반발하는 세력의 중심.
    locator: §2.24
  status: draft
  source_ids:
  - src-mastercanon-20261028
- field: 무공·무기·그 밖의 설정
  value:
    text: 미확정
    locator: §2.24
  status: draft
  source_ids:
  - src-mastercanon-20261028
- field: 고정지침
  value:
    text: 아들의 불만과 어머니 범행을 동일하게 취급하지 않는다.
    locator: §2.24
  status: draft
  source_ids:
  - src-mastercanon-20261028
- field: 보이스톤
  value:
    text: 성인 여성 중고음·얇고 차갑고 단단한 음색. 공기를 섞지 않은 선명한 발성, 짧고 정교한 발음, 절제된 높낮이. 속삭임·나른한 말끝·부드럽게 흘리는 호흡 금지. 분노하면 날카로워지되 비명처럼 높아지지 않는다. 공손한 말투 속 압박과 아들을 향한 통제는 유지한다. 혜은의 기존 승인 보이스는 바꾸지 않고 백소연 쪽을 분리한다. 64화에서 혜은과 비슷하게 들렸다는 작가 검수에 따른 교정 기준이며 새 음성의 성공은 미검증이다.
    locator: §2.24
  status: draft
  source_ids:
  - src-mastercanon-20261028
- field: 최신 사건
  value:
    text: 북해 사건 수습 시 자택 감금 2년의 형벌. 설진후를 공범으로 자동 확정하지 않는다.
    locator: §2.24
  status: draft
  source_ids:
  - src-mastercanon-20261028
- field: 대사·연기 고정지침
  value:
    text: '대사 습관: 존대와 완곡한 질문으로 통제. 설무극은 궁주님, 사적인 대면에서는 당신을 사용할 수 있다. 희선은 소궁주라 부르면서 직위의 정당성을 겨냥한다. 연기 시험 대사: [소궁주께서는 이 궁의 세월을 얼마나 아시는지요.] / [진후야. 어미가 널 위해 무엇을 견뎠는지 잊지 말거라.]

      시험 대사는 보이스 확인용이며 회차에 자동 삽입하지 않는다.'
    locator: §2.24
  status: draft
  source_ids:
  - src-mastercanon-20261028
- field: 캐릭터 시트 — 기수·모드 순서
  value:
    text: "- 기수 미지정\n  - 자료: exec-a49e5b46-7c14-40c5-941f-658903ba8a71.png — 이번 대화에서 생성한 실사 통합 시트.\n  - 자산 식별: 지속 자산 ID 미확인. 로컬 생성 자료: /workspace/scratch/378cd388864c/generated_images/exec-a49e5b46-7c14-40c5-941f-658903ba8a71.png\n  - 상세 고정: 검은 화려한 올림머리와 긴 뒷머리, 청록·샴페인 금색 자수 긴 예복·옆트임·긴 소매·백색 모피, 옥·진주 머리 장식과 목걸이·귀걸이·허리 장식, 청록 보석 장식 포인티드 토 하이힐, 네 표정. 실제 나이와 외모 나이를 구분한다.\n  - 정면·후면·사선·얼굴·착장·장신구·신발·표정을 포함한다. 분할 화면과 시트 글자는 영상에 재현하지 않는다."
    locator: §2.24
  status: draft
