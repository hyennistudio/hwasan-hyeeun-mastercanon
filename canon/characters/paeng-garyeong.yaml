- field: 성격·외모 특징
  value:
    text: 밝고 직설적이며 장난기와 거칠함.
    locator: §2.19
  status: draft
  source_ids:
  - src-mastercanon-20261028
- field: 관계·목적·정보 범위
  value:
    text: 야림주의 친딸. 검은 복면과 살수 복장으로 정체를 감추고 유진의 처소에 들어가 야림 습격을 알렸다. 야림주와 정협은 가령의 경고 사실을 모른다.
    locator: §2.19
  status: draft
  source_ids:
  - src-mastercanon-20261028
- field: 무공·무기·그 밖의 설정
  value:
    text: 패왕권 대성·호척보 유지. 혼원벽력신공, 혼원벽력도법, 혼원벽력장(권법이자 장법), 오호단문퇴(각법). 주력 실전 방식은 수투를 착용한 권각술이며 도법보다 권각을 주로 쓴다.
    locator: §2.19
  status: draft
  source_ids:
  - src-mastercanon-20261028
- field: 고정지침
  value:
    text: 친부·양녀 관계를 임의 변경하지 않는다.
    locator: §2.19
  status: draft
  source_ids:
  - src-mastercanon-20261028
- field: 보이스톤
  value:
    text: '밝고 직설적인 톤에 장난기와 거칠함이 섞여 있다.

      감정 표현이 솔직하고 크다.'
    locator: §2.19
  status: draft
  source_ids:
  - src-mastercanon-20261028
- field: 캐릭터 시트 — 기수·모드 순서
  value:
    text: "- 기수 미지정\n  - 자료: 통합 시트 또는 원본 연결 미등록\n  - 자산 식별: 미확인\n  - 상세 고정: 기존 제작 이미지가 있다면 최종 자료를 연결한다. 새 이미지가 생성됐다고 선언하지 않는다."
    locator: §2.19
  status: draft
  source_ids:
  - src-mastercanon-20261028
- field: 전승·관계 보완
  value:
    text: 타고난 무재. 열 살도 되기 전에 재능으로 이름나 팽호량이 양녀로 삼겠다고 공언했다. 친부와 그가 야림주라는 사실을 모두 안다. 45~46화에 혼자 달리는 복면 인물이 가령이며, 함께 싸워봐 말이 통하는 유진의 처소로 찾아가 채원 대상 습격을 알렸다. 다수 살수들의 채원행과 구분한다. 본명 연가령(延佳玲), 작가 채택 확정. 입양 후 이름 팽가령. 캐릭터시트 완성·등록. 최신 적용 항목 참조.
    locator: §2.19
  status: draft
  source_ids:
  - src-mastercanon-20261028
- field: 최신 적용
  value:
    text: '캐릭터시트 완성·등록: 1000035456.png. 팽가령의 본명은 연가령. 은사신발은 작가 직접 제공의 확정 설정이며 세부 능력은 임의로 추가하지 않는다. 미승인 인쇄 프로필은 무시한다.'
    locator: §2.19
  status: draft
  source_ids:
  - src-mastercanon-20261028
