- field: 무공·무기·그 밖의 설정
  value:
    text: '내공과 무공에서 발현되는 기운 색은 하늘빛 얼음색으로 고정한다.

      경지: 초절정.

      주력: 한기 장법. 내공 설심빙백공, 주력 장법 빙백신장, 보법 설영보의 세 축.

      별도 병장기 없이 맨손 장법 중심. 검으로 주력 무공을 바꾸지 않는다.

      빙백신장은 북해빙궁 관련 검색 자료에서 참고한 명칭이다. 아래 내공·보법·초식과 운용 방식은 화산혜은을 위해 창안하고 사용자 승인한 설정이며 타 작품 원문에 동일하게 존재한다고 주장하지 않는다.

      한기를 몸 안에 응축해 손바닥으로 방출한다. 평소에는 따뜻하게 웃지만 출수 순간 호흡을 짧게 정돈한다. 손가락 끝에 서리가 맺히고 장력이 닿은 곳에서 얼음이 번진다. 매 공격마다 거대한 얼음 폭풍을 만들기보다 타격과 동시에 터지는 한기로 힘을 보여준다.

      - 설화산수: 공격을 흘리고 반격하는 기본 수법. 손등으로 적의 팔을 밀어 검로를 비틀고 다른 손바닥으로 옆구리를 타격한다. 소매를 따라 짧은 서리 궤적이 흐른다.

      - 빙맥쇄관: 접촉한 상대의 움직임을 둔화한다. 손목이나 어깨를 짚어 한기를 침투시킨다. 맞은 부위에 서리가 번지고 적의 다음 동작이 굳어진다. 동급 고수는 내공으로 저항할 수 있다.

      - 한조연환: 근접 연속 장격. 짧은 보법으로 파고들며 세 차례 연속 타격한다. 첫 장은 방어를 열고, 두 번째는 중심을 무너뜨리며, 마지막 장은 적을 날려 보낸다.

      - 빙경회류: 아군을 지키는 방어 장법. 양손을 교차해 비스듬한 한기 장막을 펼치고 화살과 암기를 옆으로 튕겨낸다. 지속적인 집중 공격에는 밀린다.

      - 빙백신장: 응축한 한기를 방출하는 결정타. 가까운 거리에서 두 손바닥을 뻗으면 압축된 백색 장력이 터지고 피격 지점과 주변 바닥에 서리가 퍼진다. 연속 사용하면 내공 소모가 크다.

      빙판 위에서도 발을 크게 벌리지 않고 짧은 활보와 측면 이동으로 사각을 잡는다. 의상 시트에 고정한 백색 슬링백 하이힐의 발끝이 먼저 방향을 바꾸고 허리와 장격이 뒤따른다. 치맛자락과 망토는 움직임보다 늦게 따라와 속도와 관성을 보여준다.

      흘리기 → 접촉해 둔화 → 연속 장격 → 결정타가 기본. 칼날을 맨손으로 무작정 잡지 않고 손목·팔꿈치와 검의 옆면을 제어한다. 다수전에서는 한 명을 밀어 다른 적의 진로를 막고 즉시 다음 상대에게 붙는다. 웃으며 상대를 떠보다 궁인이 다치면 웃음기를 거두고 빠르게 제압한다. 장법이 전투를 멈추는 포즈나 반복적인 얼음 효과로 대체되지 않게 한다.

      초식 이름은 매번 외치지 않고 중요한 결정타에서만 사용한다.

      희선의 한기는 혈혼사를 일시적으로 둔화할 수 있지만 제거하지 못한다. 감염자의 몸까지 냉각되므로 계속 억누를 수 없다. 초절정인 희선이 있어도 괴질이 해결되지 않는 이유다. 혜은 일행이 사건의 배후와 빙궁 내부 배반자를 찾아야 하는 전개를 유지한다. 한기 장법을 만능 치료술로 사용하지 않는다.'
    locator: §2.4
  status: draft
