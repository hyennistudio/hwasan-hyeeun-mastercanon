- field: 관계·목적·정보 범위
  value:
    text: 혜은과 58화 재회, 59화 반가움과 소궁주 책임의 갈등. 사사혈교 간계 해결 뒤 빙궁의 벗인 화산을 잇는 대표로 출궁한다. 소궁주 지위 유지와 본인의 자발적 동행. 보상으로 넘겨지는 인물이 아니다.
    locator: §2.4
