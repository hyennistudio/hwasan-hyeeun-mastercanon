- field: 고정지침
  value:
    text: 백색·빙청색 예복과 모피 망토·청옥 장식·백색 슬링백을 고정한다. 짧은 원피스 시안으로 되돌리지 않는다. 맨손 장법 중심이며 임의 검을 지급하지 않는다. 실제 배우의 고유 음성을 복제하지 않는 독립 캐릭터 보이스다.
    locator: §2.4
  status: draft
  source_ids:
  - src-mastercanon-20261028
- field: 보이스톤
  value:
    text: 맑고 탄력 있는 중고음. 성숙한 울림에 살짝 허스키한 결이 섞인다. 말끝이 생기 있게 올라가며, 장난칠 때는 웃음기가 자연스럽게 묻어난다. 애교를 과장하지 않고 편안하고 시원하게 말한다. 혜은 앞에서는 반가움과 친근함이 풍부하게 드러난다. 소궁주로 명령할 때는 음높이를 크게 낮추지 않고 웃음기를 거두어, 짧고 또렷하게 힘을 준다.
    locator: §2.4
  status: draft
  source_ids:
  - src-mastercanon-20261028
