- field: 성격·외모 특징
  value:
    text: 밝고 에너지 넘치며 활발하고 장난기 있다. 혜은·채원과 친밀하지만 궁도들을 책임지는 지위와 3년간의 삶을 소중히 여긴다. 긴 검정 웨이브·은빛 얼음꽃 머리핀·보석 드롭 귀걸이. 얼굴과 체형은 현재 통합 시트.
