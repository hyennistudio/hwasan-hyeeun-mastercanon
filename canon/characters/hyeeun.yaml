- field: 성격·외모 특징
  value:
    text: 자기 사람들을 먼저 챙기고 리더로서 책임을 다한다. 압도적인 카리스마와 동생들을 대하는 다정함을 함께 지닌다. 긴 풍성한 갈색 웨이브, 큰 갈색 눈, 밝은 피부와 실제 피부결, 도톰한 입술. 얼굴·머리 크기·어깨·허리·골반 비례는 해당 기수 시트대로 고정한다.
    locator: §2.1
  status: draft
  source_ids:
  - src-mastercanon-20261028
- field: 관계·목적·정보 범위
  value:
    text: 현세에서 겨레의 아내. 유진을 딸처럼, 채원을 친한 동생이자 보좌로 여긴다. 채원·희선과 오래된 친밀한 관계. 후개·윤종과 북해에 도달해 희선과 재회했다. 윤종은 무림 배분상 혜은을 사고라고 부른다. 합비 사건 전모는 북행 당시 알지 못했고 은정의 죽음·아미 봉문은 알고 있다.
    locator: §2.1
  status: draft
  source_ids:
  - src-mastercanon-20261028
- field: '무공: 자하음란매화진결'
  value:
    text: 현재 7성. 혜은이 옥녀심공과 자하신공을 합쳐 스스로 창안한 무공. 8성 달성 시 혜은 4기로 변화한다.
    locator: §2.1
  status: draft
  source_ids:
