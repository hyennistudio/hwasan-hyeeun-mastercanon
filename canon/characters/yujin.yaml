- 원말 외형 나이; 장검·검집 외형과 패용; 첫 회합 후 천음색녀검결 창안·추가 돌파 장면의 세부·창안 이후 성장 과정(창안 시 1성 확정). 유진 3기 외형은 시즌4부터 적용한다. (§11.2)
