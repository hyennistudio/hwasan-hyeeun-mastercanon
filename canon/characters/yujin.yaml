facts:
- field: 나이
  value:
    text: 24세 — 작가 제공 S.H.E. 원문 기준. 원말 나이 환산 미확정.
    locator: §2.2
  status: draft
  source_ids:
  - src-mastercanon-20261028
- field: 유방 사이즈
  value:
    text: F컵 — 작가 제공 S.H.E. 원문 기준.
    locator: §2.2
  status: draft
  source_ids:
  - src-mastercanon-20261028
- field: 문파·소속
  value:
    text: 아미파. 화산에서 수련 중.
    locator: §2.2
  status: draft
  source_ids:
  - src-mastercanon-20261028
- field: 직위·별호
  value:
    text: 은정의 유일한 직전제자 / 아미 사숙조
    locator: §2.2
  status: draft
  source_ids:
  - src-mastercanon-20261028
- field: 경지
  value:
    text: 기존 조화경. 초입·3할 표기는 과거 문서 내부 표현 충돌로 세부 해석 보류. 첫 회합 후 송현 귀환 때 천음색녀검결 창안과 추가 돌파, 이후 아미산행.
    locator: §2.2
  status: draft
  source_ids:
  - src-mastercanon-20261028
- field: 성격·외모 특징
  value:
    text: 밝고 해맑으며 장난기와 대담함이 있다. 진지해져도 기본적인 생기와 밝은 음색을 유지한다. 현재 긴 핑크 웨이브·밝은 피부·시트의 얼굴 비례를 고정한다.
    locator: §2.2
  status: draft
  source_ids:
  - src-mastercanon-20261028
- field: 관계·목적·정보 범위
  value:
    text: '17~18화 만마혈전 사건에서 혈혼사에 중독되어 혈불의 미끼로 남겨졌고, 혜은이 기절시켜 데리고 나왔다. 19화 후개를 통해 치료처로 향해 20화 아미산 암자에서 은정을 생전에 직접 만나 제자가 됐다. 천음색체이며, 은정이 처음 받아들인 제자다. 시즌1 마지막에는 은정의 입적 소식과 함께 은정의 암동에서 폐관에 들어간다. 무덤에 마련된 전승 진법은 스승의 사후 안배다.

      혜은을 언니라고 부른다. 은정의 죽음과 아미 봉문을 안다. 위창해를 비무대에서 죽인 뒤 정파의 정치적 표적이 됐다. 채원과 화산에 남아 송현에게 배운다. 화산 수련을 정식 입문이나 아미 관계 포기로 바꾸지 않는다.'
    locator: §2.2
  status: draft
  source_ids:
  - src-mastercanon-20261028
- field: '무공: 난피풍검법'
  value:
    text: 대성
    locator: §2.2
  status: draft
  source_ids:
  - src-mastercanon-20261028
- field: '무공: 구전환영보'
  value:
    text: 아미파의 정통보법. 보법 사용 시 최대 9개의 환영을 만드는 현혹술을 가미한다. 유진은 10성 대성.
    locator: §2.2
  status: draft
  source_ids:
  - src-mastercanon-20261028
- field: '무공: 대라수미검'
  value:
    text: 8성. 유진이 운용하는 검은색 이기어검으로 작가가 최신 명확화. 보현 시트의 실물 장검과 구분한다.
    locator: §2.2
  status: draft
  source_ids:
  - src-mastercanon-20261028
- field: '무공: 비상련화'
  value:
    text: 7성. 이기어검으로 펼치는 아미파의 비기·절세무공. 유진은 검은색 대라수미검으로 사용한다.
    locator: §2.2
  status: draft
  source_ids:
  - src-mastercanon-20261028
- field: '무공: 천음색녀검결'
  value:
    text: 첫 정파회합 이후 송현의 귀환길에 유진이 먼저 벽을 뚫는 장면과 연결해 창안한다. 기존 조화경에서의 추가 돌파이며 조화경 최초 입문으로 바꾸지 않는다. 과거 ‘초입·3할’의 수치 해석은 미해결로 남기고 돌파를 수치화하지 않는다. 창안 시 1성에서 시작한다. 이후 성수 상승은 별도 사건으로 확정한다.
    locator: §2.2
  status: draft
  source_ids:
  - src-mastercanon-20261028
- field: 무공·무기·그 밖의 설정
  value:
    text: '이미 절세의 내공심법인 아미구양신공과 아미구음진결을 익혔으며 음양합일을 바탕으로 한다. 추가 내공심법은 필요하지 않다. 송현에게는 무공 심득의 묘리를 배우며, 옥녀심공·암향표는 전수받지 않는다.

      검기·내공 기운은 보라색으로 고정한다. 65화까지 창안·추가 돌파 완료를 선언하지 않는다. 후속 귀환 장면에서 송현이 이를 목도하는 순서를 따른다.

      2026-10-28 추가 확정·연출 지시: 천음색녀검결의 전개에서 기존 보라색 검기보다 한 단계 진화한 검강을 표현한다. 검강의 별도 신규 색상은 지정하지 않았으며, 검은색은 대라수미검 이기어검의 기준이다. 와이드 더치 오비트 액션 숏으로, 유진은 직선적이고 빠르고 강력한 동작을 멈춤 없이 이어가고 카메라가 주위를 원호로 이동한다. 카메라 회전을 맞추기 위해 인물을 제자리 회전·포즈에 묶지 않는다. 비상련화는 공중의 검은 이기어검 사출로 표현한다. 페이트의 공중 병장기 사출은 공간 배치·발사 방식 참고이며 황금 포털·다종 병장기·세계관 설정을 복제하지 않는다. 소환 수량·재질·복귀 궤도·명중 효능은 미지정. 새 초식 이름과 성수 상승은 추가하지 않는다.'
    locator: §2.2
  status: draft
  source_ids:
  - src-mastercanon-20261028
- field: 고정지침
  value:
    text: 현재 시즌3는 2기, 과거는 1기. 송현의 가르침 이후 무공 성취·심득 변화에 따라 시즌4에서 3기로 전환한다. 창안·추가 돌파와 아미산행은 시즌3 후반, 시즌4 시작부터 3기 의상을 적용한다. 시즌3 내에서 먼저 갈아입히지 않는다. 은색 디올 스트랩 하이힐 고정. 시트의 체인·옆트임·등판·기장 유지. 시트에 장검이 포함되지 않았으므로 기존 한 자루 장검을 이어받되 새로운 디자인을 확정하지 않는다.
    locator: §2.2
  status: draft
  source_ids:
  - src-mastercanon-20261028
- field: 보이스톤
  value:
    text: '매우 밝고 해맑은 톤에 애교를 강하게 넣어서 말한다.

      목소리가 경쾌하고 가벼우며, 살짝 높은 톤으로 애교를 많이 섞어 표현한다.

      감정이 강해져도 기본적인 밝고 해맑은 애교 톤을 유지한다.'
    locator: §2.2
  status: draft
  source_ids:
  - src-mastercanon-20261028
- field: 캐릭터 시트 — 기수·모드 순서
  value:
    text: "- 1기 / 과거\n  - 자료: 1000033187.png\n  - 자산 식별: libfile_9755b5a18f288191800a733ba9d491de\n  - 상세 고정: 긴 핑크 웨이브·드롭 귀걸이. 보라색 긴 원피스, 어깨 프릴·깊은 앞 트임·허리 셔링과 등 트임, 비치는 긴 치맛자락과 옆트임. 은색 디올 스트랩 힐. 과거 전용.\n- 2기 / 현재\n  - 자료: 1000033189.png\n  - 자산 식별: libfile_6b8954b578108191ab479e37570012da\n  - 상세 고정: 긴 핑크 웨이브. 버건디·보라 계열 광택 꽃 자수 긴 원피스, 얇은 어깨끈·깊은 V형 앞/등 트임·옆 허리 컷아웃·허리 체인·높은 옆트임. 은색 디올 스트랩 힐. 얼굴·체인·자수·등판·신발을 시트대로 유지.\n- 3기 / 시즌4 전환용\n  - 자료: 유진 시즌 3 프리미엄 캐릭터 시트.png\n  - 자산 식별: libfile_d92c8bd050c881918082bb4495f85abe\n  - 파일 식별: file_000000007e148209b60956934486bd49\n  - 등록 근거: 기존 생성 요청이 ‘유진 3기 캐릭터 시트’인 자산을 확인했다. 파일명의 ‘시즌 3’ 표기와 별개로 실제 적용 시점은 작가의 최신 지시인 **시즌4**를 따른다.\n  - 적용 조건: 송현의 가르침 이후의 무공 성취·심득 변화. 시즌3에는 적용하지 않는다.\n  - 신발 요청 기록: 실버 스트랩 다이아몬드 디올 하이힐, 유진 한정 스페셜 리미티드. 외형 세부 전문은 시트 이미지 재확인 후 보완한다."
    locator: §2.2
  status: draft
  source_ids:
  - src-mastercanon-20261028
- field: 전승·관계 보완
  value:
    text: 작품상 나이 24세에 조화경에 오른 예외적인 인물. 백화신니의 가르침으로 절세신공 아미구양신공·아미구음진결을 음양합일했다. 거대 문파 장로급, 소문파 가주·장주보다 높은 수준. 조화경 안의 세부 단계는 미정. 일반 후기지수의 경지 기준으로 삼지 않는다.
    locator: §2.2
  status: draft
  source_ids:
  - src-mastercanon-20261028
