- field: 캐릭터 시트 — 기수·모드 순서
  value:
    text: "- 기수 미지정\n  - 자료: 통합 시트 또는 원본 연결 미등록\n  - 자산 식별: 미확인\n  - 상세 고정: 기존 제작 이미지가 있다면 최종 자료를 연결한다. 새 이미지가 생성됐다고 선언하지 않는다."
    locator: §2.21
  status: draft
  source_ids:
  - src-mastercanon-20261028
- field: 전승·관계 보완
  value:
    text: 유진을 제외한 후기지수 최상위 세 명은 휘·단서진·양문익이며 셋의 세부 서열은 미정. 혁련에게 천뢰제왕신공과 창궁무애검법의 제왕검형을 전수받는 중. 완전 습득·성수는 미확정. 48화 오전 령령과 정략혼, 오후 용봉지회 예선 시작. 검 바보의 차갑고 표현이 서툰 인상은 논의됐으나 부부의 애정 유무와 상세 관계는 미확정. 무심하지만 책임과 예의를 지키는 신혼부부 묘사는 감독 제안.
    locator: §2.21
  status: draft
  source_ids:
  - src-mastercanon-20261028
