- field: 시트
  value:
    text: 이번 첨부 1000034707.png. 얼굴·긴 흑발과 올림 부분·옥빛 꽃 비녀·옥/진주 귀걸이·청옥색/아이보리 금빛 자수 긴 의상·허리 옥 장식·꽃 장식 하이힐을 보존한다. S.H.E. 소속·브랜드 의상으로 만들지 않는다. 시트의 24세(추정)는 출생연도 설정으로 대체한다.
