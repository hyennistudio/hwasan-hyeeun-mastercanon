- field: 성격·외모 특징
  value:
    text: 백발·짧은 흰 수염·청회색 은사 예복. 극강의 무위는 과시보다 정확한 판단과 최소한의 움직임으로 드러낸다. 고고하고 냉철하며 혈통보다 궁도의 생존과 계승자의 책임감을 앞세운다. 아들을 사랑하지만 자격 없는 계승을 허락하지 않는다. 약점은 가족에게 엄정한 결정을 미루다가 내부 균열을 키우는 것. 희선 선택의 핵심은 외부인 여부보다 위기에서 궁도를 위해 책임을 감당하는가이다. 설진후의 사치 자체보다 책임 회피와 통제되지 않는 성정을 계승 결격으로 본다.
    locator: §2.23
  status: draft
  source_ids:
  - src-mastercanon-20261028
- field: 관계·목적·정보 범위
  value:
    text: 백소연의 남편·설진후의 아버지. 외부인 희선을 계승자로 인정. 위기 해결 뒤 화산과 동맹.
    locator: §2.23
  status: draft
  source_ids:
  - src-mastercanon-20261028
- field: 무공·무기·그 밖의 설정
  value:
    text: 미확정
    locator: §2.23
  status: draft
  source_ids:
  - src-mastercanon-20261028
- field: 고정지침
  value:
    text: 최신 생성 시트의 얼굴·헤어·체형·착장·빙궁 문양을 모든 컷에서 유지한다. 극강의 위엄을 새로운 경지나 무공 성수 확정으로 바꾸지 않는다.
    locator: §2.23
  status: draft
  source_ids:
  - src-mastercanon-20261028
- field: 보이스톤
  value:
    text: 성숙한 성인 남성의 깊고 건조한 저음. 송현의 따뜻한 중저음과 달리 냉정하고 단단한 울림이며, 혈불처럼 초자연적인 변조나 과도한 거친 소리는 없다. 느리되 말을 끌지 않고 짧은 문장으로 결론부터 말한다. 자음은 정확하고 끝음은 낮게 닫으며 문장 사이 침묵으로 권위를 만든다. 평상시 음량은 절제되고 안정적이다. 명령할 때는 핵심 단어에만 강세를 싣고, 분노할수록 속도를 낮추며 더욱 또렷하게 발음한다. 아들을 대할 때는 억눌린 실망과 부정이 섞이고, 희선을 인정할 때도 감상적인 온기로 바꾸지 않으며 담담한 신뢰를 드러낸다. 전투의 짧은 외침은 낮은 진성으로 단단하게 전달한다.
    locator: §2.23
  status: draft
  source_ids:
  - src-mastercanon-20261028
- field: 대사·연기 고정지침
  value:
    text: '대사 습관: 결론→이유 순서. 희선에게는 이름과 소궁주 직위를 상황에 맞춰 사용하며, 아들에게는 진후라 부른다. 공석에서 가족 감정보다 궁주의 판단을 앞세운다. 연기 시험 대사: [궁은 혈통으로 지키는 것이 아니다.] / [진후야. 네가 지키려는 것이 무엇이냐.]

      시험 대사는 보이스 확인용이며 회차에 자동 삽입하지 않는다.'
    locator: §2.23
  status: draft
  source_ids:
  - src-mastercanon-20261028
- field: 캐릭터 시트 — 기수·모드 순서
  value:
    text: "- 기수 미지정\n  - 자료: exec-20399b95-1066-4675-9aef-977e821bad1d.png — 이번 대화에서 생성한 실사 통합 시트.\n  - 자산 식별: 지속 자산 ID 미확인. 로컬 생성 자료: /workspace/scratch/378cd388864c/generated_images/exec-20399b95-1066-4675-9aef-977e821bad1d.png\n  - 상세 고정: 청회색 긴 예복·은빛 서리 가지와 산수 자수, 백발 반묶음과 청옥 머리 장식, 짧은 흰 수염, 눈 결정 안에 산봉우리를 넣은 빙궁 문양, 허리 세공·태슬·장화·손·표정. 무기 패널 없음.\n  - 정면·후면·사선·얼굴·착장·장신구·신발·표정을 포함한다. 분할 화면과 시트 글자는 영상에 재현하지 않는다."
    locator: §2.23
  status: draft
