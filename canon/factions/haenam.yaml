facts:
- field: 원문 언급
  value:
    text: '해남: 혈강시·혈혼사의 사사혈교 교두보. 54화부터 구파 입성을 추진하는 흐름이며, 현시점 아미파 축출과 정식 교체는 미완료. 혈불이 조종 중이다. 혁련·현운자는 위창해가 혈강시임을 느끼지만 배후가 사사혈교라는 사실은 아직 모른다. 혈강시 감지·침묵과 배후 인지를 구분한다.'
    locator: §3
  status: draft
  source_ids:
  - src-mastercanon-20261028
- field: 원문 언급
  value:
    text: 아미 쇠퇴와 용봉지회 유진 사건을 이용한 퇴출 및 해남파(해남검문) 추대의 배후는 민아. 혈불의 사사혈교에 잠식돼 전원이 혈강시화한 해남을 정파 내부에 넣어 미래 대전쟁에 구파일방·오대세가를 내부 와해시키려 한다. 현시점 아미는 구파, 교체는 미완료. 기존 73화 축출 예정과 구분한다.
    locator: §3
