    text: '구정련: 혁련·현운자가 흑도척결을 앞세워 구파일방·오대세가·나머지 정파를 결집한다. 민아는 적들이 모이는 것을 반기고 주원장을 이용할 계산을 한다. 창천신검이 유진을 무력으로 꺾는 안은 폐기, 핵심은 정치적 고립이다.'
