  value:
    text: '아미: 현재 구파일방 소속. 2대 은정 입적, 3대 장문은 미정, 현재 4대 보현. 스스로 문을 닫은 봉문과 정파가 자리를 빼앗는 축출을 구분한다.'
    locator: §3
  status: draft
