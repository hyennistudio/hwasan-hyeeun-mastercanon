    text: 팽가도법은 하북팽가 도법의 총칭. 오호단문도·건곤연환 탈백도·혼원벽력도법을 각 인물의 주력으로 구분한다. 오호단문도의 중국 전통무술·소림팔법 유래 설명은 작가가 제공한 참고 설명이며 이번 편집에서 역사 검증한 사실로 확대하지 않는다.
